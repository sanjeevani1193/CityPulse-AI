# Separate from Forecasting v1. No credentials or data are built into this image.
services:
  sqlpilot:
    image: citypulse-sqlpilot:local
    build:
      context: .
      dockerfile: docker/sqlpilot.Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - type: bind
        source: ${SQLPILOT_SAMPLE_DATABASE:?Set an absolute path to the approved small DuckDB sample}
        target: /data/sample.duckdb
        read_only: true
        bind:
          create_host_path: false
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SQLPILOT_PROVIDER: ${SQLPILOT_PROVIDER:-}
      SQLPILOT_MODEL: ${SQLPILOT_MODEL:-}
      SQLPILOT_PROVIDER_APPROVED: ${SQLPILOT_PROVIDER_APPROVED:-}
      SQLPILOT_FREE_ALLOWANCE_VERIFIED: ${SQLPILOT_FREE_ALLOWANCE_VERIFIED:-}
      SQLPILOT_APPROVED_SCHEMA_SHA256: ${SQLPILOT_APPROVED_SCHEMA_SHA256:-}
      SQLPILOT_QUESTIONS_APPROVED: ${SQLPILOT_QUESTIONS_APPROVED:-}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/sqlpilot:size=16m,uid=10001,gid=10001
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
