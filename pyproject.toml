[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citypulse-ai"
version = "0.1.0"
description = "Urban mobility demand forecasting and AI analytics using NYC Citi Bike and weather data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "pytz>=2024.1", # DuckDB's Python TIMESTAMPTZ retrieval requires pytz.
]

[project.scripts]
citypulse-etl = "citypulse_ai.etl.cli:main"
citypulse-publish = "citypulse_ai.cloud.publish:main"

[project.optional-dependencies]
sqlpilot = ["duckdb==1.5.6"] # Native AST policy is tested against this exact version.
cloud = ["google-cloud-storage>=3,<4"]
dev = ["pytest>=8,<10"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4"]
diagnostics = ["matplotlib>=3.9,<4", "numpy>=2,<3"]
forecasting = ["xgboost==3.4.1", "scikit-learn>=1.6,<2", "numpy>=2,<3"]
neural = ["torch==2.14.1", "scikit-learn>=1.6,<2", "numpy>=2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
       "torch==2.14.1", "xgboost==3.4.1", "scikit-learn>=1.6,<2", "numpy>=2,<3"]
tensorflow = ["tensorflow==2.21.0", "keras==3.15.1", "scikit-learn>=1.6,<2", "numpy>=1.26,<3"]
lstm-worker = ["tensorflow==2.21.0", "keras==3.15.1", "numpy==2.4.6",
               "scikit-learn==1.9.1", "h5py==3.14.0", "fastapi==0.143.0", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["citypulse_ai*"]

[tool.setuptools.package-data]
"citypulse_ai.api" = ["station_artifacts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -ra"
