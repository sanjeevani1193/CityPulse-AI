name: ExperimentLab statistics
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  station-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --only-binary=:all: -r ci/experimentlab-requirements.txt
      - run: python -m pytest tests/test_experimentlab.py -q --tb=short
      - name: Generate and verify reproducible report
        run: |
          python -m citypulse_ai.experiments.redistribution --output "$RUNNER_TEMP/experimentlab"
          python -c 'import os,json,hashlib; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"experimentlab"; m=json.loads((p/"checksums.json").read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in m.items())'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimentlab-synthetic-report
          path: ${{ runner.temp }}/experimentlab/
          retention-days: 14
          if-no-files-found: error
