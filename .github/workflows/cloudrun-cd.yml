name: XGBoost Cloud Run CD

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/citypulse_ai/api/**'
      - 'src/citypulse_ai/features/**'
      - 'src/citypulse_ai/forecasting/**'
      - 'src/citypulse_ai/etl/**'
      - 'src/citypulse_ai/__init__.py'
      - 'docker/cloudrun-xgboost*'
      - 'infra/cloudbuild-xgboost.yaml'
      - 'infra/cloudrun-cd-inputs.json'
      - 'scripts/cloudrun_cd.py'
      - '.github/workflows/cloudrun-cd.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: citypulse-xgboost-deployment
  cancel-in-progress: false

jobs:
  ci-gate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require all three successful push CI runs on the exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/cloudrun_cd.py gate --sha "$SOURCE_SHA"

  deploy:
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install CPU-only packaging dependencies
        run: |
          python -m pip install --only-binary=:all: -r docker/cloudrun-xgboost.requirements.txt google-cloud-storage==3.5.0 PyYAML==6.0.3
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: citypulse-ai-511315
          workload_identity_provider: projects/64394592274/locations/global/workloadIdentityPools/citypulse-cloudrun-cd/providers/github-main
          service_account: citypulse-xgb-deployer@citypulse-ai-511315.iam.gserviceaccount.com
      - name: Restore exactly five generation-pinned private inputs and package
        run: python scripts/cloudrun_cd.py restore
      - name: One Cloud Build and image-only update of the existing service
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/cloudrun_cd.py deploy --sha "$SOURCE_SHA"
      - name: Obtain short-lived audience-bound invocation token
        id: invoke
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: citypulse-ai-511315
          workload_identity_provider: projects/64394592274/locations/global/workloadIdentityPools/citypulse-cloudrun-cd/providers/github-main
          service_account: citypulse-xgb-deployer@citypulse-ai-511315.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.deployment.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Authenticated endpoints and saved-validation parity
        env:
          SERVICE_ID_TOKEN: ${{ steps.invoke.outputs.id_token }}
          SERVICE_URL: ${{ steps.deployment.outputs.url }}
        run: python scripts/cloudrun_cd.py verify --url "$SERVICE_URL"
      - name: Retain sanitized receipts only, never source/model/credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudrun-cd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/cloudrun-cd/deployment.json
            outputs/cloudrun-cd/verification.json
          if-no-files-found: warn
          retention-days: 14
